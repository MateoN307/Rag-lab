[project]
name = "rag-vault"
version = "0.1.0"
description = "A from-scratch RAG pipeline over my Obsidian notes, built to learn how LLM retrieval works and how to design a project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb==1.5.9",
    "ollama==0.6.2",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff",
]

[tool.ruff]
target-version = "py314"
src = ["app", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["app", "scripts"]
